<script>(function () {
  var STORE = 'nat_atlas_k:' + location.pathname;   // свій ключ на кожну сторінку x/<slug>/: атлас і бета-атлас — різні ключі на одному сайті
  function bytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var r = atob(s), u = new Uint8Array(r.length);
    for (var i = 0; i < r.length; i++) u[i] = r.charCodeAt(i);
    return u;
  }

  function stored() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }

  crypto.subtle.importKey('raw', bytes(k), 'AES-GCM', false, ['decrypt'])
    .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: blob.slice(0, 12) }, key, blob.slice(12)); })
