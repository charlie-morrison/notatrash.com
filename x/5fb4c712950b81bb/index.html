<script>(function () {
  var STORE = 'nat_atlas_k:' + location.pathname;   // свій ключ на кожну сторінку x/<slug>/: атлас і бета-атлас — різні ключі на одному сайті
  function bytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var r = atob(s), u = new Uint8Array(r.length);
    for (var i = 0; i < r.length; i++) u[i] = r.charCodeAt(i);
    return u;
  }
  function fail() { document.getElementById('msg').hidden = false; }
  function stored() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  var m = /(?:^#|&)k=([A-Za-z0-9_-]{43})(?:&|$)/.exec(location.hash), k = m ? m[1] : stored();
  if (!k || !window.crypto || !crypto.subtle) return fail();
  var blob = bytes(document.getElementById('c').textContent.trim());
  crypto.subtle.importKey('raw', bytes(k), 'AES-GCM', false, ['decrypt'])
    .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: blob.slice(0, 12) }, key, blob.slice(12)); })
    .then(function (pt) {
      try { localStorage.setItem(STORE, k); } catch (e) {}
      var html = new TextDecoder().decode(pt);
      function swap() { setTimeout(function () { document.open(); document.write(html); document.close(); }, 0); }
      if (document.readyState === 'complete') swap(); else window.addEventListener('load', swap, { once: true });
    }, function () {
      try { if (stored() === k) localStorage.removeItem(STORE); } catch (e) {}
      fail();
    });
})();</script>
